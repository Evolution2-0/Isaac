<!DOCTYPE html>
<html lang="de" data-theme="studio-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISAAC · Command Studio & Live Neural Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Three.js for 3D Memory & Neural Graph -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ═══ High-Tech Studio Theme Tokens ═══ */
:root, html[data-theme="studio-dark"] {
  --bg-app: #07090e;
  --bg-panel: #0d1117;
  --bg-card: #131924;
  --bg-input: #090d14;
  --border: #1e2838;
  --border-focus: #00f0ff;
  --border-hot: #2a374d;

  --text-main: #e2e8f0;
  --text-muted: #8899ac;
  --text-dim: #52637a;

  --accent-cyan: #00f0ff;
  --accent-amber: #ffb000;
  --accent-emerald: #00ff88;
  --accent-rose: #ff3366;
  --accent-violet: #9d4edd;
  --accent-blue: #3a86ff;

  --cyan-soft: rgba(0, 240, 255, 0.08);
  --amber-soft: rgba(255, 176, 0, 0.08);
  --emerald-soft: rgba(0, 255, 136, 0.08);
  --rose-soft: rgba(255, 51, 102, 0.08);

  --radius-panel: 6px;
  --radius-sm: 4px;
  --font-sans: "Space Grotesk", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --shadow-panel: 0 4px 20px rgba(0,0,0,0.6);
  --panel-gap: 10px;
}

html[data-theme="tactile-amber"] {
  --bg-app: #0c0a07;
  --bg-panel: #16120d;
  --bg-card: #201a13;
  --bg-input: #0a0805;
  --border: #332719;
  --border-focus: #ffb000;
  --border-hot: #4a3a26;

  --text-main: #f5e8d5;
  --text-muted: #ad9a82;
  --text-dim: #70604d;

  --accent-cyan: #ffb000;
  --accent-amber: #ff8800;
  --accent-emerald: #52e07e;
  --accent-rose: #ff4757;
  --accent-violet: #d47aff;
  --accent-blue: #2ed573;

  --cyan-soft: rgba(255, 176, 0, 0.1);
  --amber-soft: rgba(255, 136, 0, 0.1);
}

html[data-theme="cyber-emerald"] {
  --bg-app: #050d0a;
  --bg-panel: #0b1a14;
  --bg-card: #11261d;
  --bg-input: #040a08;
  --border: #19382b;
  --border-focus: #00ff88;
  --border-hot: #23523e;

  --text-main: #e0f7ed;
  --text-muted: #83b39d;
  --text-dim: #4d7a66;

  --accent-cyan: #00ff88;
  --accent-amber: #ffd166;
  --accent-emerald: #06d6a0;
  --accent-rose: #ef476f;
  --accent-violet: #118ab2;
  --accent-blue: #00b4d8;

  --cyan-soft: rgba(0, 255, 136, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100dvh; width: 100vw; overflow: hidden; }

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: var(--border-hot); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

.scroll-y { overflow-y: auto; overflow-x: hidden; min-height: 0; }
.scroll-x { overflow-x: auto; overflow-y: hidden; }
.mono { font-family: var(--font-mono); }

/* Buttons & Inputs */
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
input, select, textarea {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 0.8rem;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 8px var(--cyan-soft); }

.btn {
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: all 0.15s ease;
}
.btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); background: var(--cyan-soft); }
.btn-primary { background: var(--cyan-soft); border-color: var(--accent-cyan); color: var(--accent-cyan); }
.btn-primary:hover { background: var(--accent-cyan); color: #000; }
.btn-danger { border-color: var(--accent-rose); color: var(--accent-rose); }
.btn-danger:hover { background: var(--accent-rose); color: #000; }
.btn-sm { padding: 3px 8px; font-size: 0.7rem; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
  border-radius: 3px; font-size: 0.68rem; font-family: var(--font-mono);
  border: 1px solid var(--border); background: rgba(0,0,0,0.3);
}
.badge-cyan { border-color: rgba(0,240,255,0.4); color: var(--accent-cyan); background: var(--cyan-soft); }
.badge-emerald { border-color: rgba(0,255,136,0.4); color: var(--accent-emerald); background: var(--emerald-soft); }
.badge-amber { border-color: rgba(255,176,0,0.4); color: var(--accent-amber); background: var(--amber-soft); }
.badge-rose { border-color: rgba(255,51,102,0.4); color: var(--accent-rose); background: var(--rose-soft); }

/* Header Studio Bar */
.studio-header {
  height: 48px;
  flex: 0 0 48px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  gap: 12px;
  z-index: 10;
}

.brand-box { display: flex; align-items: center; gap: 10px; }
.brand-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-cyan); }
.brand-status { font-size: 0.7rem; font-family: var(--font-mono); color: var(--text-muted); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; }
.status-dot.online { background: var(--accent-emerald); box-shadow: 0 0 10px var(--accent-emerald); }
.status-dot.busy { background: var(--accent-amber); animation: pulse-glow 1.2s infinite; }
.status-dot.offline { background: var(--accent-rose); }

@keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.header-controls { display: flex; align-items: center; gap: 10px; }

/* Main Grid Shell */
.studio-shell {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr) 340px;
  gap: var(--panel-gap);
  padding: var(--panel-gap);
  background: var(--bg-app);
}

body.layout-wide .studio-shell { grid-template-columns: 60px minmax(0, 1fr) 320px; }
body.layout-focus .studio-shell { grid-template-columns: 0px minmax(0, 1fr) 0px; }

/* Panels */
.studio-panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  box-shadow: var(--shadow-panel);
  position: relative;
  overflow: hidden;
}

.panel-head {
  height: 36px;
  flex: 0 0 36px;
  padding: 0 12px;
  background: rgba(0,0,0,0.25);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-head h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; }
.panel-body { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; }

/* Left Nav Bar */
.nav-menu { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 0.78rem;
  justify-content: flex-start;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.nav-item .icon { font-size: 0.95rem; width: 20px; text-align: center; }
.nav-item:hover { color: var(--text-main); background: var(--bg-card); }
.nav-item.active { background: var(--cyan-soft); color: var(--accent-cyan); border-color: rgba(0,240,255,0.25); font-weight: 600; }

body.layout-wide .nav-item span:not(.icon) { display: none; }

/* ISAAC'S EYE / LIVE TERMINAL OS */
.live-os-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.live-os-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }

.terminal-box {
  background: #020408;
  border: 1px solid var(--border-hot);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: #00ffaa;
  padding: 10px;
  display: flex;
  flex-direction: column;
}
.terminal-head {
  padding-bottom: 6px;
  margin-bottom: 6px;
  border-bottom: 1px dashed var(--border);
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 0.7rem;
}
.terminal-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.term-line { white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
.term-line.cmd { color: var(--accent-cyan); }
.term-line.out { color: var(--text-main); }
.term-line.err { color: var(--accent-rose); }
.term-line.thought { color: var(--accent-violet); font-style: italic; }

.screen-preview-box {
  background: #000;
  border: 1px solid var(--border-hot);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.screen-preview-overlay {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

/* Tasks & Replay Scrubber */
.task-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: border-color 0.15s;
}
.task-card:hover { border-color: var(--border-hot); }
.task-card.running { border-left: 3px solid var(--accent-amber); }
.task-card.done { border-left: 3px solid var(--accent-emerald); }
.task-card.failed { border-left: 3px solid var(--accent-rose); }

.task-header {
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 70px 90px 1fr 80px 40px;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 0.8rem;
}
.task-details {
  padding: 12px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  display: none;
}
.task-card.expanded .task-details { display: block; }

/* Control Grids */
.control-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card-item h3 { font-size: 0.82rem; font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

/* Chat Column */
.chat-box { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.msg-list { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.msg-bubble {
  max-width: 90%;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.82rem;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-bubble.steffen { align-self: flex-end; background: var(--amber-soft); border: 1px solid rgba(255,176,0,0.3); color: var(--text-main); }
.msg-bubble.isaac { align-self: flex-start; background: var(--cyan-soft); border: 1px solid rgba(0,240,255,0.3); color: var(--text-main); }
.msg-bubble.sys { align-self: center; background: transparent; color: var(--text-dim); font-size: 0.72rem; }

.chat-input-area { padding: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }

/* 3D Canvas Graph Container */
#graph-container {
  width: 100%;
  height: 400px;
  background: #020408;
  border: 1px solid var(--border-hot);
  border-radius: var(--radius-sm);
  position: relative;
}

/* Swarm Topology Visualizer Tree */
.swarm-tree {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px;
  background: #020408;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.swarm-node {
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-cyan);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.swarm-subnodes { margin-left: 20px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; border-left: 1px dashed var(--border-hot); padding-left: 12px; }

@media (max-width: 900px) {
  .studio-shell { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(350px, 1fr); overflow-y: auto; }
  body { overflow: auto; height: auto; }
  .live-os-split { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Studio Header Bar -->
<header class="studio-header">
  <div class="brand-box">
    <span id="conn-dot" class="status-dot offline"></span>
    <div>
      <div class="brand-title">ISAAC Studio OS</div>
      <div class="brand-status"><span id="live-intent">LIVE · Initialisiere Engine...</span></div>
    </div>
  </div>

  <div class="header-controls">
    <!-- Quick Telemetry Badges -->
    <span class="badge badge-cyan" id="hdr-provider">Relay: -</span>
    <span class="badge badge-emerald" id="hdr-tasks">Tasks: 0</span>
    <span class="badge badge-amber" id="hdr-mode">Mode: Auto</span>

    <!-- Feature 3: Audio Deck Toggle -->
    <button type="button" class="btn btn-sm" id="audio-btn" onclick="toggleAudio()" title="Tactile Audio Feedback">
      🔊 Audio: OFF
    </button>
    <button type="button" class="btn btn-sm" id="speech-btn" onclick="toggleSpeech()" title="Voice Feedback Synthesis">
      🗣 Voice: OFF
    </button>

    <!-- Theme Switcher -->
    <select id="theme-select" onchange="setTheme(this.value)" style="padding: 3px 6px;">
      <option value="studio-dark">Studio Dark</option>
      <option value="tactile-amber">Tactile Amber</option>
      <option value="cyber-emerald">Cyber Emerald</option>
    </select>

    <!-- System Controls -->
    <button type="button" class="btn btn-sm" onclick="sendCmd('status')">Status</button>
    <button type="button" class="btn btn-sm btn-danger" id="pause-btn" onclick="togglePause()">Pause</button>
    <span class="badge mono" id="clock">00:00:00</span>
  </div>
</header>

<!-- Main Grid Shell -->
<div class="studio-shell">

  <!-- Left Column: Navigation & Control Hub -->
  <aside class="studio-panel">
    <div class="panel-head">
      <h2>Control Hub</h2>
      <span class="badge mono" id="ws-status">WS...</span>
    </div>
    <div class="panel-body">
      <nav class="nav-menu">
        <button type="button" class="nav-item active" data-nav="live-os" onclick="setNav('live-os')">
          <span class="icon">👁</span><span>Isaac's Eye (LIVE)</span>
        </button>
        <button type="button" class="nav-item" data-nav="tasks" onclick="setNav('tasks')">
          <span class="icon">▣</span><span>Tasks & Pipeline</span>
        </button>
        <button type="button" class="nav-item" data-nav="graph-3d" onclick="setNav('graph-3d')">
          <span class="icon">🕸</span><span>3D Memory Graph</span>
        </button>
        <button type="button" class="nav-item" data-nav="playground" onclick="setNav('playground')">
          <span class="icon">💻</span><span>Code Playground</span>
        </button>
        <button type="button" class="nav-item" data-nav="swarm" onclick="setNav('swarm')">
          <span class="icon">🌿</span><span>Swarm Topology</span>
        </button>
        <button type="button" class="nav-item" data-nav="providers" onclick="setNav('providers')">
          <span class="icon">⚙</span><span>Provider Hub</span>
        </button>
        <button type="button" class="nav-item" data-nav="tools" onclick="setNav('tools')">
          <span class="icon">⚒</span><span>Tools & MCP</span>
        </button>
        <button type="button" class="nav-item" data-nav="settings" onclick="setNav('settings')">
          <span class="icon">🎛</span><span>Runtime Settings</span>
        </button>
        <button type="button" class="nav-item" data-nav="neural" onclick="setNav('neural')">
          <span class="icon">⌬</span><span>Neural Matrix</span>
        </button>
        <button type="button" class="nav-item" data-nav="governance" onclick="setNav('governance')">
          <span class="icon">⚖</span><span>Governance & Memory</span>
        </button>
      </nav>

      <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);">
        <div style="font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono);">
          SYSTEM HEALTH<br>
          <span id="health-stats">CPU: Normal | Mem: Stable</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Center Column: Primary Stage Area -->
  <main class="studio-panel">
    <div class="panel-head">
      <h2 id="stage-title">ISAAC'S EYE · LIVE COGNITION</h2>
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn btn-sm" onclick="toggleLayout('focus')">Focus Mode</button>
        <button type="button" class="btn btn-sm" onclick="toggleLayout('wide')">Wide View</button>
      </div>
    </div>

    <div class="panel-body scroll-y" id="stage-content">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Right Column: Live Chat & Prompt Terminal -->
  <aside class="studio-panel">
    <div class="panel-head">
      <h2>Interactive Chat</h2>
      <button type="button" class="btn btn-sm" onclick="clearChat()">Clear</button>
    </div>
    <div class="panel-body chat-box">
      <div class="msg-list scroll-y" id="msg-list"></div>

      <div class="chat-input-area">
        <div style="display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px;">
          <button type="button" class="btn btn-sm" onclick="quickPrompt('status:pipeline')">Pipeline</button>
          <button type="button" class="btn btn-sm" onclick="quickPrompt('ziele')">Ziele</button>
          <button type="button" class="btn btn-sm" onclick="quickPrompt('status:smoke')">Smoke</button>
        </div>
        <textarea id="chat-input" rows="2" placeholder="Prompt oder Befehl eingeben..." style="width: 100%; resize: vertical;"></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.68rem; color: var(--text-dim);" class="mono">Shift+Enter für Zeilenumbruch</span>
          <button type="button" class="btn btn-primary" onclick="sendChat()">Senden ↵</button>
        </div>
      </div>
    </div>
  </aside>

</div>

<script>
/* ═══ ISAAC COMMAND STUDIO ENGINE V2 ═══ */

const STATE = {
  nav: localStorage.getItem('isaac.nav') || 'live-os',
  theme: localStorage.getItem('isaac.theme') || 'studio-dark',
  layout: localStorage.getItem('isaac.layout') || 'normal',
  ws: null,
  online: false,
  paused: false,
  audioEnabled: false,
  speechEnabled: false,
  systemState: {},
  tasks: {},
  expandedTaskIds: new Set(),
  liveLogs: [],
  auditEvents: [],
  tools: [],
  providers: [],
};

function $(id) { return document.getElementById(id); }
function esc(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function updateClock() {
  $('clock').textContent = new Date().toLocaleTimeString('de-DE');
}
setInterval(updateClock, 1000); updateClock();

/* ═══ FEATURE 3: TACTILE AUDIO SYNTHESIZER ═══ */
let audioCtx = null;
function playSciFiSound(freq = 440, type = 'sine', duration = 0.08) {
  if (!STATE.audioEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) { console.error(e); }
}

function speakText(text) {
  if (!STATE.speechEnabled || !('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text.slice(0, 150));
  utter.lang = 'de-DE';
  synth.speak(utter);
}

function toggleAudio() {
  STATE.audioEnabled = !STATE.audioEnabled;
  $('audio-btn').textContent = STATE.audioEnabled ? '🔊 Audio: ON' : '🔊 Audio: OFF';
  $('audio-btn').classList.toggle('btn-primary', STATE.audioEnabled);

/* FEATURE 1: 3D INTERACTIVE MEMORY GRAPH */
function renderGraph3DStage() {
  return `
    <div style="display: flex; flex-direction: column; gap: 10px; height: 100%;">
      <div style="font-size: 0.8rem; color: var(--text-muted);">
        Interaktiver 3D-Graph von Isaacs Memory-Knoten und neuronalen Relationen. Ziehe mit der Maus zum Drehen!
      </div>
      <div id="graph-container"></div>
    </div>
  `;
}

function init3DGraph() {
  const container = $('graph-container');
  if (!container || typeof THREE === 'undefined') return;
  container.innerHTML = '';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.z = 15;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // Nodes geometry
  const group = new THREE.Group();
  scene.add(group);

  const colors = [0x00f0ff, 0x00ff88, 0xffb000, 0x9d4edd];
  const nodeCount = 20;
  for (let i = 0; i < nodeCount; i++) {
    const geom = new THREE.SphereGeometry(0.35, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length], wireframe: true });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 8
    );
    group.add(mesh);
  }

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.005;
    group.rotation.x += 0.002;
    renderer.render(scene, camera);
  }
  animate();
}

/* ═══ ACTIONS & API CALLS ═══ */
function sendCmd(cmd) { playSciFiSound(500, 'sine'); send({ typ: 'command', text: cmd }); }
function togglePause() {
  playSciFiSound(300, 'square');
  if (STATE.paused) send({ typ: 'resume' }); else send({ typ: 'pause' });
}
function cancelTask(id) { send({ typ: 'task_cancel', task_id: id }); }
function resumeTask(id) {
  fetch('/api/tasks/resume', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ task_id: id }) })
    .then(r => r.json()).then(j => alert(j.ok ? 'Task Resumed' : 'Error: ' + j.error));
}
function requestTasks() { send({ typ: 'tasks_request' }); }

function addDirective() {
  const t = $('dir-text').value.trim(); if (!t) return;
  send({ typ: 'directive_add', text: t, priority: 10 });
  $('dir-text').value = '';
}
function revokeDirective(id) { send({ typ: 'directive_revoke', id: id }); }

function upsertProvider() {
  const payload = {
    id: $('prov-id').value.trim(),
    model: $('prov-model').value.trim(),
    api_key: $('prov-key').value.trim(),
    base_url: $('prov-url').value.trim()
  };
  fetch('/api/providers/upsert', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) })
    .then(r => r.json()).then(j => alert(j.ok ? 'Provider gespeichert!' : 'Fehler: ' + j.error));
}

function testProvider(id) {
  fetch('/api/providers/test', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ provider_id: id }) })
    .then(r => r.json()).then(j => alert(j.ok ? 'Test Erfolgreich!\n' + j.response_preview : 'Fehler: ' + j.error));
}

function setDefaultProvider(id) {
  fetch('/api/providers/set_default', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ provider_id: id }) })
    .then(r => r.json()).then(j => alert(j.ok ? 'Standard Provider gesetzt!' : 'Fehler: ' + j.error));
}

function toggleTool(toolId, active) {
  fetch('/api/tools/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tool_id: toolId, active: active }) })
    .then(r => r.json()).then(() => send({ typ: 'state_request' }));
}

function installFreePack() {
  fetch('/api/tools/install_free_pack', { method: 'POST' })
    .then(r => r.json()).then(j => alert(j.ok ? `Installiert: ${j.installed_count} Tools` : 'Fehler: ' + j.error));
}

/* Chat Operations */
function sendChat() {
  const input = $('chat-input');
  const text = input.value.trim(); if (!text) return;
  playSciFiSound(600, 'sine', 0.08);
  addMsg('steffen', text);
  input.value = '';
  send({ typ: 'chat', text: text });
}
function quickPrompt(p) { $('chat-input').value = p; sendChat(); }
function clearChat() { $('msg-list').innerHTML = ''; }

function addMsg(who, text) {
  const list = $('msg-list');
  const div = document.createElement('div');
  div.className = 'msg-bubble ' + who;
  div.textContent = text;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
  if (who === 'isaac') speakText(text);
}

/* ═══ WEBSOCKET COMMUNICATION ═══ */
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws';

  const ws = new WebSocket(url);

  ws.onopen = () => {
    STATE.online = true; STATE.ws = ws;
    $('conn-dot').className = 'status-dot online';
    $('ws-status').textContent = 'WS ONLINE';
    send({ typ: 'state_request' });
  };

  ws.onmessage = (e) => {
    try { handleWSMessage(JSON.parse(e.data)); } catch(err) { console.error(err); }
  };

  ws.onclose = () => {
    STATE.online = false;
    $('conn-dot').className = 'status-dot offline';
    $('ws-status').textContent = 'WS RETRYING';
    setTimeout(connect, 2000);
  };
}

function send(obj) {
  if (STATE.ws && STATE.ws.readyState === 1) STATE.ws.send(JSON.stringify(obj));
}

function handleWSMessage(msg) {
  switch(msg.typ) {
    case 'init':
    case 'state':
      if (msg.state) {
        STATE.systemState = msg.state;
        STATE.paused = !!msg.state.paused;
        $('pause-btn').textContent = STATE.paused ? 'Weiter' : 'Pause';
        $('hdr-provider').textContent = 'Relay: ' + (msg.state.settings?.active_provider || 'Default');
        renderStage();
      }
      break;
    case 'tasks':
      (msg.tasks || []).forEach(t => { if (t && t.id) STATE.tasks[t.id] = t; });
      if (STATE.nav === 'tasks') renderStage();
      break;
    case 'task_update':
      if (msg.task && msg.task.id) {
        STATE.tasks[msg.task.id] = msg.task;
        if (STATE.nav === 'tasks') renderStage();
      }
      break;
    case 'chat_response':
      addMsg('isaac', msg.text || '');
      break;
  }
}

/* Boot Initialization */
setTheme(STATE.theme);
setNav(STATE.nav);
connect();
</script>
